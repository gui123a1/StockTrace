# Nginx site for StockTrace
# Install: /etc/nginx/sites-available/stocktrace → sites-enabled
# Requires: htpasswd file at /etc/nginx/.htpasswd_stocktrace

server {
    listen 80;
    server_name stocktrace.yumeat.cc.cd;

    # Cloudflare Flexible SSL terminates at edge; origin is HTTP
    client_max_body_size 10m;

    auth_basic "StockTrace";
    auth_basic_user_file /etc/nginx/.htpasswd_stocktrace;

    root /opt/stocktrace/frontend/dist;
    index index.html;

    # SPA history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/stocktrace/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Optional: deny access to accidental backup tarballs under dist
    location ~* \.(tar|gz|zip)$ {
        deny all;
    }
}
